name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: latchkeywhite16-release-v135
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6

      - name: Add original Face ID White theme
        run: |
          rm -rf /tmp/LatchKey
          git clone --depth=1 https://github.com/MDausch/LatchKey.git /tmp/LatchKey
          SRC="/tmp/LatchKey/Layout/Library/Application Support/LatchKey/Themes/ios12/Face_ID_White.bundle"
          DEST="layout/Library/Application Support/LatchKeyWhite16"
          mkdir -p "$DEST"
          cp -R "$SRC" "$DEST/Face_ID_White.bundle"

      - name: Add Settings Face ID icon
        run: |
          ICON="layout/Library/PreferenceLoader/Preferences/LatchKeyWhite16.png"
          mkdir -p "$(dirname "$ICON")"
          python3 -c "import base64,pathlib; pathlib.Path('$ICON').write_bytes(base64.b64decode(''))"
          test -s "$ICON"

      - name: Verify working iOS 16 path, color picker and Settings icon
        run: |
          CAML="layout/Library/Application Support/LatchKeyWhite16/Face_ID_White.bundle/Face_ID_White.ca/main.caml"
          ICON_PLIST="layout/Library/PreferenceLoader/Preferences/LatchKeyWhite16.plist"
          ICON_FILE="layout/Library/PreferenceLoader/Preferences/LatchKeyWhite16.png"
          test -f "$CAML"
          test -s "$ICON_FILE"
          grep -q '<LKState name="Locked"' "$CAML"
          grep -q '<LKState name="Unlocked"' "$CAML"
          grep -q 'Face_ID_37.png' "$CAML"
          grep -q '<key>icon</key>' "$ICON_PLIST"
          grep -q '/var/jb/Library/PreferenceLoader/Preferences/LatchKeyWhite16.png' "$ICON_PLIST"
          ! grep -q 'iconImageSystem' "$ICON_PLIST"

          grep -q 'updateText:(BOOL)updateText' Tweak.xm
          grep -q '_activeViewsForState:(long long)state' Tweak.xm
          grep -q 'LKWViewsByKeepingLockActive' Tweak.xm
          grep -q '_shouldApplyScaleAndBlurForAuthenticated' Tweak.xm
          grep -q 'LKWForceUnlockedVisibility' Tweak.xm
          grep -q 'LKWApplyGeometry' Tweak.xm
          grep -q 'xOffset' Tweak.xm
          grep -q 'yOffset' Tweak.xm
          grep -q 'glyphScale' Tweak.xm
          grep -q 'animationColor' Tweak.xm
          grep -q 'colorMonochrome' Tweak.xm
          grep -q 'LKWApplyAnimationColorToPackage' Tweak.xm
          grep -q 'CGAffineTransformMakeScale' Tweak.xm
          grep -q 'transform.tx = xOffset' Tweak.xm
          grep -q 'transform.ty = yOffset' Tweak.xm
          grep -q 'LKWRefreshVisibleRoots' Tweak.xm

          grep -q 'X Offset' LatchKeyWhite16Prefs/LKWRootListController.m
          grep -q 'Y Offset' LatchKeyWhite16Prefs/LKWRootListController.m
          grep -q 'Scale' LatchKeyWhite16Prefs/LKWRootListController.m
          grep -q 'Reset Position & Scale' LatchKeyWhite16Prefs/LKWRootListController.m
          grep -q 'Animation Color' LatchKeyWhite16Prefs/LKWRootListController.m
          grep -q 'UIColorPickerViewController' LatchKeyWhite16Prefs/LKWRootListController.m
          grep -q 'Reset Color to White' LatchKeyWhite16Prefs/LKWRootListController.m

          ! grep -q 'positionOption' Tweak.xm
          ! grep -q 'PSLinkListCell' LatchKeyWhite16Prefs/LKWRootListController.m
          ! grep -q 'LKWOwnedPackage' Tweak.xm
          ! grep -q 'LKWPausePackageLayer' Tweak.xm

      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1
          ls -lh packages

      - name: Verify package contents
        run: |
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          rm -rf /tmp/latchkey-deb
          mkdir -p /tmp/latchkey-deb
          cd /tmp/latchkey-deb
          ar -x "$GITHUB_WORKSPACE/$DEB"
          DATA_TAR="$(find . -maxdepth 1 -name 'data.tar*' -type f | head -n 1)"
          test -n "$DATA_TAR"
          tar -tf "$DATA_TAR" | tee /tmp/package-files.txt
          grep -q "var/jb/Library/MobileSubstrate/DynamicLibraries/LatchKeyWhite16.dylib" /tmp/package-files.txt
          grep -q "var/jb/Library/Application Support/LatchKeyWhite16/Face_ID_White.bundle/Face_ID_White.ca/main.caml" /tmp/package-files.txt
          grep -q "var/jb/Library/PreferenceBundles/LatchKeyWhite16Prefs.bundle/LatchKeyWhite16Prefs" /tmp/package-files.txt
          grep -q "var/jb/Library/PreferenceLoader/Preferences/LatchKeyWhite16.plist" /tmp/package-files.txt
          grep -q "var/jb/Library/PreferenceLoader/Preferences/LatchKeyWhite16.png" /tmp/package-files.txt
          if grep -q "var/jb/var/jb/" /tmp/package-files.txt; then
            echo "Invalid double rootless prefix found"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LatchKeyWhite16-deb
          path: packages/*.deb

      - name: Remove old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.5"

          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r OLD_TAG; do
            [ -z "$OLD_TAG" ] && continue
            [ "$OLD_TAG" = "$TAG" ] && continue
            gh release delete "$OLD_TAG" --yes --cleanup-tag || true
          done

          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | while read -r OLD_TAG; do
            [ -z "$OLD_TAG" ] && continue
            [ "$OLD_TAG" = "$TAG" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$OLD_TAG" >/dev/null 2>&1 || true
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.5"
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          gh release create "$TAG" "$DEB" \
            --title "LatchKey White 16 v1.3.5" \
            --notes "Adds a native iOS color picker for the Face ID animation. White remains the default and restores the original appearance. Existing position, scale, persistence and Settings icon behavior are retained." \
            --latest

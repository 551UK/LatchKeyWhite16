name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6

      - name: Add original Face ID White theme
        run: |
          rm -rf /tmp/LatchKey
          git clone --depth=1 https://github.com/MDausch/LatchKey.git /tmp/LatchKey
          SRC="/tmp/LatchKey/Layout/Library/Application Support/LatchKey/Themes/ios12/Face_ID_White.bundle"
          DEST="layout/Library/Application Support/LatchKeyWhite16"
          mkdir -p "$DEST"
          cp -R "$SRC" "$DEST/Face_ID_White.bundle"

      - name: Verify original theme
        run: |
          CAML="layout/Library/Application Support/LatchKeyWhite16/Face_ID_White.bundle/Face_ID_White.ca/main.caml"
          test -f "$CAML"
          grep -q '<LKState name="Sleep">' "$CAML"
          grep -q '<LKState name="Unlocked">' "$CAML"
          grep -q 'Face_ID_37.png' "$CAML"

      - name: Build rootless package
        run: |
          make clean package FINALPACKAGE=1
          ls -lh packages

      - name: Verify package contents
        run: |
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          rm -rf /tmp/latchkey-deb
          mkdir -p /tmp/latchkey-deb
          cd /tmp/latchkey-deb
          ar -x "$GITHUB_WORKSPACE/$DEB"
          DATA_TAR="$(find . -maxdepth 1 -name 'data.tar*' -type f | head -n 1)"
          test -n "$DATA_TAR"
          tar -tf "$DATA_TAR" | tee /tmp/package-files.txt
          grep -q "var/jb/Library/MobileSubstrate/DynamicLibraries/LatchKeyWhite16.dylib" /tmp/package-files.txt
          grep -q "var/jb/Library/Application Support/LatchKeyWhite16/Face_ID_White.bundle/Face_ID_White.ca/main.caml" /tmp/package-files.txt
          grep -q "var/jb/Library/PreferenceBundles/LatchKeyWhite16Prefs.bundle/LatchKeyWhite16Prefs" /tmp/package-files.txt
          grep -q "var/jb/Library/PreferenceLoader/Preferences/LatchKeyWhite16.plist" /tmp/package-files.txt
          if grep -q "var/jb/var/jb/" /tmp/package-files.txt; then
            echo "Invalid double rootless prefix found"
            exit 1
          fi

          mkdir -p /tmp/latchkey-data
          tar -xf "$DATA_TAR" -C /tmp/latchkey-data
          CAML="/tmp/latchkey-data/var/jb/Library/Application Support/LatchKeyWhite16/Face_ID_White.bundle/Face_ID_White.ca/main.caml"
          test -f "$CAML"
          grep -q '<LKState name="Sleep">' "$CAML"
          grep -q '<LKState name="Unlocked">' "$CAML"
          grep -q 'Face_ID_37.png' "$CAML"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LatchKeyWhite16-deb
          path: packages/*.deb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.6"
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" "$DEB" \
            --title "LatchKey White 16 v1.2.6" \
            --notes "Uses the original unmodified Face ID White theme. After the 1-second unlock animation finishes, the tweak pins a separate Face ID White package already in its Unlocked/tick state over the lock view. That pinned final state is independent of Apple's animation state machine and stays visible until the lock returns to Locked. Default positioning remains unchanged." \
            --latest
